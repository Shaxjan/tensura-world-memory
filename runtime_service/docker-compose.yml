services:
  tensura-runtime:
    build:
      context: ..
      dockerfile: runtime_service/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      TENSURA_GITHUB_WEBHOOK_SECRET: ${TENSURA_GITHUB_WEBHOOK_SECRET}
      TENSURA_API_TOKEN: ${TENSURA_API_TOKEN:-}
      TENSURA_BRANCH: ${TENSURA_BRANCH:-main}
      TENSURA_REQUIRED_TRANSPORT_MODE: always_on_service
      PORT: 8080
    volumes:
      - tensura_repo:/srv/tensura
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  tensura_repo:
