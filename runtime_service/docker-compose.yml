services:
  tensura-runtime:
    build:
      context: ..
      dockerfile: runtime_service/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      TENSURA_GITHUB_WEBHOOK_SECRET: ${TENSURA_GITHUB_WEBHOOK_SECRET}
      TENSURA_API_TOKEN: ${TENSURA_API_TOKEN:-}
      TENSURA_BRANCH: ${TENSURA_BRANCH:-main}
      TENSURA_REQUIRED_TRANSPORT_MODE: always_on_service
      PORT: 8080
    volumes:
      - tensura_repo:/srv/tensura

volumes:
  tensura_repo:
