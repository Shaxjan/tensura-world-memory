name: Simulation Engine Tests

on:
  push:
    paths:
      - 'sim_engine/**'
      - 'memory/money_reconciliation_v159.json'
      - '.github/workflows/sim-engine-v02.yml'
  pull_request:
    paths:
      - 'sim_engine/**'
      - 'memory/money_reconciliation_v159.json'
      - '.github/workflows/sim-engine-v02.yml'
  workflow_dispatch:

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run v0.2 tests
        working-directory: sim_engine
        run: python -m unittest -v test_v02.py
      - name: Run v0.2 autonomy smoke test
        working-directory: sim_engine
        run: python v02_probe.py --days 1 > /tmp/v02_probe.json
      - name: Run v0.3 tests
        working-directory: sim_engine
        run: python -m unittest -v test_v03.py
      - name: Run v0.3 30-day regional probe
        working-directory: sim_engine
        run: python v03_probe.py --days 30 > /tmp/v03_probe.json
      - name: Run v0.4 tests
        working-directory: sim_engine
        run: python -m unittest -v test_v04.py
      - name: Run v0.4 60-day rules probe
        working-directory: sim_engine
        run: python v04_probe.py --days 60 > /tmp/v04_probe.json
      - name: Run v0.5 tests
        working-directory: sim_engine
        run: python -m unittest -v test_v05.py
      - name: Run v0.5 30-day grounded-world probe
        working-directory: sim_engine
        run: python v05_probe.py --days 30 > /tmp/v05_probe.json
      - name: Run v0.6 tests
        working-directory: sim_engine
        run: python -m unittest -v test_v06.py
      - name: Run v0.6 100-turn GM loop probe
        working-directory: sim_engine
        run: python v06_probe.py --turns 100 > /tmp/v06_probe.json
      - name: Rehearse current live campaign migration
        working-directory: sim_engine
        run: python v06_rehearsal.py --repo-root .. --out /tmp/v06_rehearsal.json
      - name: Run v0.7 tests
        working-directory: sim_engine
        run: python -m unittest -v test_v07.py
      - name: Rehearse source-grounded v0.7 baselines
        working-directory: sim_engine
        run: python v07_rehearsal.py --repo-root .. --out /tmp/v07_rehearsal.json
      - name: Run v0.8 tests
        working-directory: sim_engine
        run: python -m unittest -v test_v08.py
      - name: Rehearse v0.8 money reconciliation
        working-directory: sim_engine
        run: python v08_rehearsal.py --repo-root .. --out /tmp/v08_rehearsal.json
      - name: Run v0.9 tests
        working-directory: sim_engine
        run: python -m unittest -v test_v09.py
      - name: Rehearse v0.9 portable runtime handoff
        working-directory: sim_engine
        run: python v09_rehearsal.py --repo-root .. --out /tmp/v09_rehearsal.json --checkpoint-out /tmp/v09_runtime_state.json
      - name: Run v0.10 tests
        working-directory: sim_engine
        run: python -m unittest -v test_v10.py
      - name: Rehearse v0.10 scene bridge and autonomy cutover gate
        working-directory: sim_engine
        run: python v10_rehearsal.py --repo-root .. --out /tmp/v10_rehearsal.json
      - name: Run v1.0 tests
        working-directory: sim_engine
        run: python -m unittest -v test_v100.py
      - name: Rehearse v1.0 authoritative runtime cutover
        working-directory: sim_engine
        run: python v100_rehearsal.py --repo-root .. --out /tmp/v100_rehearsal.json

  cutover_bundle:
    if: github.event_name == 'push' && github.ref == 'refs/heads/sim-engine-v100'
    needs: test
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sim-engine-v100
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate immutable v159 cutover checkpoint and prepared pointer
        working-directory: sim_engine
        run: >-
          python v100_rehearsal.py --repo-root ..
          --out /tmp/v100_rehearsal.json
          --checkpoint-out ../runtime/checkpoints/cutover_v159.json
          --manifest-out ../runtime/runtime_state.json
      - name: Commit generated cutover bundle to candidate branch
        run: |
          git config user.name "tensura-runtime-bot"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/checkpoints/cutover_v159.json runtime/runtime_state.json
          if git diff --cached --quiet; then
            echo "Cutover bundle already current"
            exit 0
          fi
          git commit -m "v1.0 generated cutover bundle for LIVE v159"
          git push origin HEAD:sim-engine-v100
