name: Threads Radar Native Acceptance
on:
  push:
    branches:
      - radar-stage-b-index-20261020
    paths:
      - ".github/workflows/radar-native-acceptance.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Full corpus Python and Node gate
        run: python -B threads/radar/integration_gate.py --repo-root .
