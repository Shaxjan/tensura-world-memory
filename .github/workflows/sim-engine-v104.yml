name: Simulation Engine v1.0.4 Legacy Regression

on:
  push:
    paths:
      - 'sim_engine/v104_*.py'
      - 'sim_engine/test_v104.py'
      - 'sim_engine/V104.md'
      - '.github/workflows/sim-engine-v104.yml'
      - '.github/workflows/runtime-turn.yml'
      - 'MASTER_SAVE_PROTOCOL.md'
  pull_request:
    paths:
      - 'sim_engine/v104_*.py'
      - 'sim_engine/test_v104.py'
      - 'sim_engine/V104.md'
      - '.github/workflows/sim-engine-v104.yml'
      - '.github/workflows/runtime-turn.yml'
      - 'MASTER_SAVE_PROTOCOL.md'

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run v1.0 regression tests
        working-directory: sim_engine
        run: python -m unittest -v test_v100.py
      - name: Run v1.0.1 regression tests
        working-directory: sim_engine
        run: python -m unittest -v test_v101.py
      - name: Run v1.0.2 regression tests
        working-directory: sim_engine
        run: python -m unittest -v test_v102.py
      - name: Run v1.0.3 regression tests
        working-directory: sim_engine
        run: python -m unittest -v test_v103.py
      - name: Run v1.0.4 regression tests
        working-directory: sim_engine
        run: python -m unittest -v test_v104.py
      - name: Note
        run: echo "v1.0.4 LIVE migration retired after Character Core activation; current activation belongs to v1.0.5+"
