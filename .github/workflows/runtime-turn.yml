name: Tensura Runtime Turn

on:
  push:
    branches: [main]
    paths:
      - 'runtime/requests/r*.json'
      - 'runtime/requests/q-*.json'

concurrency:
  group: tensura-authoritative-runtime
  cancel-in-progress: false

jobs:
  process_turn:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout triggering request commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Identify exactly one request from triggering commit
        id: req
        shell: bash
        run: |
          REQUEST=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" \
            | grep -E '^runtime/requests/(r[0-9]{6}|q-[^/]+)\.json$' \
            | sort -u || true)
          COUNT=$(printf '%s\n' "$REQUEST" | sed '/^$/d' | wc -l)
          if [ "$COUNT" -ne 1 ]; then
            echo "Expected exactly one runtime request in triggering commit; found $COUNT"
            printf '%s\n' "$REQUEST"
            exit 1
          fi
          echo "path=$REQUEST" >> "$GITHUB_OUTPUT"

      - name: Fast-forward to current authoritative main
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main
          test -f "${{ steps.req.outputs.path }}"

      - name: Execute authoritative turn
        id: execute
        shell: bash
        run: |
          set +e
          ENGINE=$(python - <<'PY'
          import json
          print(json.load(open("runtime/runtime_state.json", encoding="utf-8"))["engine_version"])
          PY
          )
          if [ "$ENGINE" = "1.0.12" ]; then
            python sim_engine/v112_request_processor.py --repo-root . --request "${{ steps.req.outputs.path }}" --out /tmp/runtime-turn.json > /tmp/runtime-turn.stdout 2> /tmp/runtime-turn.stderr
          elif [ "$ENGINE" = "1.0.11" ]; then
            python sim_engine/v111_request_processor.py --repo-root . --request "${{ steps.req.outputs.path }}" --out /tmp/runtime-turn.json > /tmp/runtime-turn.stdout 2> /tmp/runtime-turn.stderr
          elif [ "$ENGINE" = "1.0.10" ]; then
            python sim_engine/v110_request_processor.py --repo-root . --request "${{ steps.req.outputs.path }}" --out /tmp/runtime-turn.json > /tmp/runtime-turn.stdout 2> /tmp/runtime-turn.stderr
          elif [ "$ENGINE" = "1.0.9" ]; then
            python sim_engine/v109_request_processor.py --repo-root . --request "${{ steps.req.outputs.path }}" --out /tmp/runtime-turn.json > /tmp/runtime-turn.stdout 2> /tmp/runtime-turn.stderr
          else
            echo "Unsupported authoritative runtime engine: $ENGINE" > /tmp/runtime-turn.stderr
            false
          fi
          CODE=$?
          set -e
          cat /tmp/runtime-turn.stdout || true
          if [ "$CODE" -ne 0 ]; then
            cat /tmp/runtime-turn.stderr >&2 || true
            if [ "$ENGINE" = "1.0.12" ]; then
              python sim_engine/v112_receipt.py --repo-root . --request "${{ steps.req.outputs.path }}" --status failed --error-file /tmp/runtime-turn.stderr
              echo "failed=true" >> "$GITHUB_OUTPUT"
            fi
            exit "$CODE"
          fi
          echo "failed=false" >> "$GITHUB_OUTPUT"

      - name: Commit engine event, pointer, session and receipt
        if: success()
        shell: bash
        run: |
          git config user.name "tensura-runtime-bot"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/journal runtime/runtime_state.json runtime/session_state.json runtime/request_receipts
          git commit -m "Runtime event $(basename '${{ steps.req.outputs.path }}' .json)"
          if ! git push origin HEAD:main; then
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Commit failure receipt
        if: failure() && steps.execute.outputs.failed == 'true'
        shell: bash
        run: |
          git config user.name "tensura-runtime-bot"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/request_receipts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Runtime request failure receipt $(basename '${{ steps.req.outputs.path }}')"
          if ! git push origin HEAD:main; then
            git pull --rebase origin main
            git push origin HEAD:main
          fi
