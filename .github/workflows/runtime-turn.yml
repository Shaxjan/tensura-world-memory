name: Tensura Runtime Turn

on:
  push:
    branches: [main]
    paths:
      - 'runtime/requests/r*.json'
      - 'runtime/requests/q-*.json'

concurrency:
  group: tensura-authoritative-runtime
  cancel-in-progress: false

jobs:
  process_turn:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            sim_engine
            runtime
          sparse-checkout-cone-mode: true

      - name: Find request from triggering push
        id: req
        shell: bash
        run: |
          mapfile -t REQUESTS < <(
            jq -r '[.commits[]? | (.added[]?, .modified[]?)][]' "$GITHUB_EVENT_PATH" \
              | grep -E '^runtime/requests/(r[0-9]{6}|q-[^/]+)\.json$' \
              | sort -u || true
          )
          if [ "${#REQUESTS[@]}" -ne 1 ]; then
            echo "Expected exactly one runtime request in triggering push; found ${#REQUESTS[@]}"
            printf '%s\n' "${REQUESTS[@]}"
            exit 1
          fi
          REQUEST="${REQUESTS[0]}"
          if [ ! -f "$REQUEST" ]; then
            echo "Trigger request is not present on current main: $REQUEST"
            exit 1
          fi
          echo "path=$REQUEST" >> "$GITHUB_OUTPUT"

      - name: Execute authoritative turn
        shell: bash
        run: |
          python3 --version
          ENGINE=$(python3 - <<'PY'
          import json
          print(json.load(open("runtime/runtime_state.json", encoding="utf-8"))["engine_version"])
          PY
          )
          if [ "$ENGINE" = "1.0.11" ]; then
            python3 sim_engine/v111_request_processor.py --repo-root . --request "${{ steps.req.outputs.path }}" --out /tmp/runtime-turn.json
          elif [ "$ENGINE" = "1.0.10" ]; then
            python3 sim_engine/v110_request_processor.py --repo-root . --request "${{ steps.req.outputs.path }}" --out /tmp/runtime-turn.json
          elif [ "$ENGINE" = "1.0.9" ]; then
            python3 sim_engine/v109_request_processor.py --repo-root . --request "${{ steps.req.outputs.path }}" --out /tmp/runtime-turn.json
          elif [ "$ENGINE" = "1.0.8" ]; then
            python3 sim_engine/v108_request_processor.py --repo-root . --request "${{ steps.req.outputs.path }}" --out /tmp/runtime-turn.json
          elif [ "$ENGINE" = "1.0.7" ]; then
            python3 sim_engine/v107_request_processor.py --repo-root . --request "${{ steps.req.outputs.path }}" --out /tmp/runtime-turn.json
          elif [ "$ENGINE" = "1.0.6" ]; then
            python3 sim_engine/v106_request_processor.py --repo-root . --request "${{ steps.req.outputs.path }}" --out /tmp/runtime-turn.json
          elif [ "$ENGINE" = "1.0.5" ]; then
            python3 sim_engine/v105_request_processor.py --repo-root . --request "${{ steps.req.outputs.path }}" --out /tmp/runtime-turn.json
          elif [ "$ENGINE" = "1.0.4" ]; then
            python3 sim_engine/v104_request_processor.py --repo-root . --request "${{ steps.req.outputs.path }}" --out /tmp/runtime-turn.json
          elif [ "$ENGINE" = "1.0.3" ]; then
            python3 sim_engine/v103_request_processor.py --repo-root . --request "${{ steps.req.outputs.path }}" --out /tmp/runtime-turn.json
          elif [ "$ENGINE" = "1.0.2" ]; then
            python3 sim_engine/v102_request_processor.py --repo-root . --request "${{ steps.req.outputs.path }}" --out /tmp/runtime-turn.json
          else
            echo "Unsupported authoritative runtime engine: $ENGINE"
            exit 1
          fi

      - name: Commit engine event, pointer and session fast-path
        shell: bash
        run: |
          git config user.name "tensura-runtime-bot"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/journal runtime/runtime_state.json runtime/session_state.json
          git commit -m "Runtime event $(basename '${{ steps.req.outputs.path }}' .json)"
          if ! git push origin HEAD:main; then
            echo "main advanced during turn; rebasing non-conflicting runtime commit"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
