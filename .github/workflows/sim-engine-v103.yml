name: Simulation Engine v1.0.3 Living Scene

on:
  push:
    branches: [main]
    paths:
      - 'sim_engine/v103_*.py'
      - 'sim_engine/test_v103.py'
      - 'sim_engine/V103.md'
      - '.github/workflows/sim-engine-v103.yml'
      - '.github/workflows/runtime-turn.yml'
      - 'MASTER_SAVE_PROTOCOL.md'
  pull_request:
    paths:
      - 'sim_engine/v103_*.py'
      - 'sim_engine/test_v103.py'
      - 'sim_engine/V103.md'
      - '.github/workflows/sim-engine-v103.yml'
      - '.github/workflows/runtime-turn.yml'
      - 'MASTER_SAVE_PROTOCOL.md'

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run v1.0 regression tests
        working-directory: sim_engine
        run: python -m unittest -v test_v100.py
      - name: Run v1.0.1 regression tests
        working-directory: sim_engine
        run: python -m unittest -v test_v101.py
      - name: Run v1.0.2 regression tests
        working-directory: sim_engine
        run: python -m unittest -v test_v102.py
      - name: Run v1.0.3 tests
        working-directory: sim_engine
        run: python -m unittest -v test_v103.py
      - name: Rehearse current LIVE pending Borga search
        working-directory: sim_engine
        run: python v103_rehearsal.py --repo-root .. --out /tmp/v103_rehearsal.json

  activate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    concurrency:
      group: tensura-authoritative-runtime
      cancel-in-progress: false
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fast-forward to current main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Activate v1.0.3 and resume already-authorized living search
        run: python sim_engine/v103_activate.py --repo-root . --out /tmp/v103-activate.json
      - name: Commit v1.0.3 runtime activation
        run: |
          git config user.name "tensura-runtime-bot"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/checkpoints/v103_base_j*.json runtime/journal runtime/session_state.json runtime/runtime_state.json
          if git diff --cached --quiet; then
            echo "v1.0.3 runtime already active"
            exit 0
          fi
          git commit -m "Runtime v1.0.3 — living scene activation"
          git push origin HEAD:main
