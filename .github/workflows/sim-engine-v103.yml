name: Simulation Engine v1.0.3 Legacy Regression

on:
  push:
    paths:
      - 'sim_engine/v103_*.py'
      - 'sim_engine/test_v103.py'
      - 'sim_engine/V103.md'
      - '.github/workflows/sim-engine-v103.yml'
  pull_request:
    paths:
      - 'sim_engine/v103_*.py'
      - 'sim_engine/test_v103.py'
      - 'sim_engine/V103.md'
      - '.github/workflows/sim-engine-v103.yml'

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run v1.0 regression tests
        working-directory: sim_engine
        run: python -m unittest -v test_v100.py
      - name: Run v1.0.1 regression tests
        working-directory: sim_engine
        run: python -m unittest -v test_v101.py
      - name: Run v1.0.2 regression tests
        working-directory: sim_engine
        run: python -m unittest -v test_v102.py
      - name: Run v1.0.3 regression tests
        working-directory: sim_engine
        run: python -m unittest -v test_v103.py
      - name: Note
        run: echo "v1.0.3 LIVE migration/activation retired after successful cutover; v1.0.4+ owns current LIVE rehearsal."
