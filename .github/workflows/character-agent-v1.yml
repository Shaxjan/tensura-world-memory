name: Playable Alpha Character Agent v1

on:
  push:
    branches: [main]
    paths:
      - 'sim_engine/character_agent_contract.py'
      - 'sim_engine/test_character_agent_contract.py'
      - 'sim_engine/rena_character_profile.py'
      - 'sim_engine/test_rena_character_profile.py'
      - 'sim_engine/character_agent_shadow.py'
      - 'sim_engine/test_character_agent_shadow.py'
      - 'sim_engine/character_agent_shadow_rehearsal.py'
      - 'sim_engine/character_agent_event.py'
      - 'sim_engine/test_character_agent_event.py'
      - 'sim_engine/character_agent_event_rehearsal.py'
      - 'sim_engine/CHARACTER_AGENT_V1.md'
      - 'sim_engine/CHARACTER_AGENT_SHADOW_V1.md'
      - '.github/workflows/character-agent-v1.yml'
  pull_request:
    paths:
      - 'sim_engine/character_agent_contract.py'
      - 'sim_engine/test_character_agent_contract.py'
      - 'sim_engine/rena_character_profile.py'
      - 'sim_engine/test_rena_character_profile.py'
      - 'sim_engine/character_agent_shadow.py'
      - 'sim_engine/test_character_agent_shadow.py'
      - 'sim_engine/character_agent_shadow_rehearsal.py'
      - 'sim_engine/character_agent_event.py'
      - 'sim_engine/test_character_agent_event.py'
      - 'sim_engine/character_agent_event_rehearsal.py'
      - 'sim_engine/CHARACTER_AGENT_V1.md'
      - 'sim_engine/CHARACTER_AGENT_SHADOW_V1.md'
      - '.github/workflows/character-agent-v1.yml'

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Character Agent, profile, shadow and event tests
        working-directory: sim_engine
        run: >-
          python -m unittest -v
          test_character_agent_contract.py
          test_rena_character_profile.py
          test_character_agent_shadow.py
          test_character_agent_event.py
      - name: Rehearse replay-safe Rena shadow decision
        working-directory: sim_engine
        run: python character_agent_shadow_rehearsal.py --repo-root .. --out /tmp/character_agent_shadow_rehearsal.json
      - name: Rehearse deterministic Character Decision events
        working-directory: sim_engine
        run: python character_agent_event_rehearsal.py --repo-root .. --out /tmp/character_agent_event_rehearsal.json
      - name: Compile Character Agent development layer
        working-directory: sim_engine
        run: >-
          python -m py_compile
          character_agent_contract.py
          test_character_agent_contract.py
          rena_character_profile.py
          test_rena_character_profile.py
          character_agent_shadow.py
          test_character_agent_shadow.py
          character_agent_shadow_rehearsal.py
          character_agent_event.py
          test_character_agent_event.py
          character_agent_event_rehearsal.py
