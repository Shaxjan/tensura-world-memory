name: Zero Cost Playable Pages

on:
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/zero-cost-playable-pages.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'runtime/session_state.json'
      - '.github/workflows/zero-cost-playable-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test browser Character Agent Lite
        run: node --test site/test_engine.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy current authoritative HUD snapshot
        run: cp runtime/session_state.json site/live-snapshot.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static prototype
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
