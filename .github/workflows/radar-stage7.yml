name: Threads Radar Stage 7 Acceptance
on:
  push:
    branches: [radar-stage-b-index-20261020]
    paths: [.github/workflows/radar-stage7.yml]
permissions:
  contents: read
jobs:
  native-459:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Native full corpus gate
        run: python -B threads/radar/integration_gate.py --repo-root .
