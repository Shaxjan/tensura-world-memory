name: Simulation Engine v1.0.7 Legacy Regression

on:
  push:
    branches: [main]
    paths:
      - 'sim_engine/v107_*.py'
      - 'sim_engine/test_v107.py'
      - 'sim_engine/V107.md'
      - '.github/workflows/sim-engine-v107.yml'
  pull_request:
    paths:
      - 'sim_engine/v107_*.py'
      - 'sim_engine/test_v107.py'
      - 'sim_engine/V107.md'
      - '.github/workflows/sim-engine-v107.yml'

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run v1.0.7 regression tests
        working-directory: sim_engine
        run: python -m unittest -v test_v107.py
