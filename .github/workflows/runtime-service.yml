name: Tensura Always-On Runtime Service

on:
  pull_request:
    paths:
      - 'runtime_service/**'
      - '.github/workflows/runtime-service.yml'
      - '.github/workflows/runtime-turn.yml'
  push:
    branches: [main]
    paths:
      - 'runtime_service/**'
      - '.github/workflows/runtime-service.yml'
      - '.github/workflows/runtime-turn.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        working-directory: runtime_service
        run: python -m unittest -v test_app.py
      - name: Python compile check
        run: python -m py_compile runtime_service/app.py runtime_service/activate_transport.py
      - name: Shell syntax check
        run: sh -n runtime_service/entrypoint.sh
      - name: Build portable runtime image
        run: docker build -f runtime_service/Dockerfile .
